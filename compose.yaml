services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://squinder:squinder@postgres:5432/squinder
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '7131:3000'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: squinder
      MINIO_ROOT_PASSWORD: squinder
    healthcheck:
      test:
        ['CMD', 'curl', '-sf', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    # Squinder owns the local 713x port range to avoid clashes with
    # other projects: 7131 api, 7132 crm, 7133 s3, 7134 s3 console,
    # 7135 postgres.
    ports:
      - '7133:9000'
      - '7134:9001'
    volumes:
      - minio-data:/data

  # One-shot: creates the public bucket and mirrors ./profiles into it.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 squinder squinder &&
        mc mb --ignore-existing local/squinder &&
        mc anonymous set download local/squinder &&
        mc mirror --overwrite /seed-profiles local/squinder/profiles &&
        echo 'MinIO ready: bucket "squinder" public, profiles synced'
    volumes:
      - ./profiles:/seed-profiles:ro

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: squinder
      POSTGRES_PASSWORD: squinder
      POSTGRES_USER: squinder
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U squinder -d squinder']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '7135:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./apps/api/docker/postgres:/docker-entrypoint-initdb.d

volumes:
  minio-data:
  postgres-data:
